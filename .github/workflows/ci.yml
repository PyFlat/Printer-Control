name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PrinterControl.slnx

      - name: Build
        run: dotnet build PrinterControl.slnx --no-restore --configuration Release

      # The tests start fake printer servers on a loopback port, so they need no printer.
      - name: Test
        run: dotnet test PrinterControl.slnx --no-build --configuration Release
